name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: true
        type: boolean

# Build jobs stay strictly read-only; only publish-release requests contents: write.
permissions:
  contents: read

env:
  # IMPORTANT: Keep CUDA on 12.x (12.9). Do NOT bump to CUDA 13.x — CUDA 13.x
  # dropped NVIDIA Volta (sm_70 / Tesla V100) support completely.
  CUDA_VERSION: '12.9'
  CUDA_ARCHITECTURES: '70;86'

jobs:
  resolve-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Compute release tag & mode
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            DRAFT="${INPUT_DRAFT:-true}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRAFT="false"
          fi
          case "$TAG" in
            *[!A-Za-z0-9._+-]*|"")
              echo "Invalid release tag: '$TAG'" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (draft=$DRAFT)"

  build-linux-cuda-release:
    name: Build Linux CUDA 12.9 .zip (Ubuntu 24.04)
    needs: resolve-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install minimal CUDA 12.9 toolkit & build tools
        run: |
          # Keep CUDA on 12.9 (sm_70 Volta support was removed in CUDA 13.x).
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          rm -f /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            ccache \
            zip \
            cuda-nvcc-12-9 \
            cuda-cudart-dev-12-9 \
            cuda-driver-dev-12-9 \
            libcublas-dev-12-9 \
            cuda-cccl-12-9
          echo "/usr/local/cuda-12.9/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda-12.9" >> "$GITHUB_ENV"
          /usr/local/cuda-12.9/bin/nvcc --version

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-cuda129-ubuntu2404-${{ env.CUDA_ARCHITECTURES }}-${{ hashFiles('CMakeLists.txt', 'ggml/src/ggml-cuda/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-cuda129-ubuntu2404-${{ env.CUDA_ARCHITECTURES }}-${{ hashFiles('CMakeLists.txt', 'ggml/src/ggml-cuda/CMakeLists.txt') }}-
            ccache-cuda129-ubuntu2404-${{ env.CUDA_ARCHITECTURES }}-

      - name: Configure & build Linux CUDA release binaries
        run: |
          ccache --zero-stats
          cmake -S . -B build-linux-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_BUILD_RPATH=$ORIGIN' \
            '-DCMAKE_INSTALL_RPATH=$ORIGIN' \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_KVARN=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="${{ env.CUDA_ARCHITECTURES }}" \
            -DCUDAToolkit_ROOT=/usr/local/cuda-12.9 \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.9/bin/nvcc \
            -DGGML_CCACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_RPC=OFF \
            -DLLAMA_BUILD_BORINGSSL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-linux-cuda --parallel 3 \
            --target llama-server llama-cli llama-bench llama-perplexity test-backend-ops
          ccache --show-stats

      - name: Package Linux CUDA .zip
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          STAGE="dist-linux/qwen-cpp-${TAG}-ubuntu-cuda-12.9-sm70_86-x64"
          mkdir -p "$STAGE" dist-linux-out
          for bin in llama-server llama-cli llama-bench llama-perplexity test-backend-ops; do
            cp -a "build-linux-cuda/bin/$bin" "$STAGE/"
          done
          shopt -s nullglob
          for lib in build-linux-cuda/bin/lib*.so*; do
            cp -a "$lib" "$STAGE/"
          done
          cp LICENSE README.md "$STAGE/"
          ZIP_NAME="qwen-cpp-${TAG}-bin-ubuntu-cuda-12.9-sm70_86-x64.zip"
          (cd dist-linux && zip -r -y "../dist-linux-out/${ZIP_NAME}" "$(basename "$STAGE")")
          ls -lh "dist-linux-out/${ZIP_NAME}"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-cuda
          path: dist-linux-out/*.zip
          retention-days: 7
          if-no-files-found: error

  build-windows-cuda-release:
    name: Build Windows CUDA 12.9 .zip + cudart .zip (Windows 2022)
    needs: resolve-tag
    # Pinned to windows-2022 (Visual Studio 2022 / MSVC 14.4x).
    # Do NOT use windows-latest (VS 2026 / MSVC 14.5x breaks CUDA 12.9 nvcc,
    # and CUDA 13.x drops sm_70 Volta support).
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 3G

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup MSVC 2022 (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Restore sccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: sccache-cuda129-win2022-${{ env.CUDA_ARCHITECTURES }}-${{ hashFiles('CMakeLists.txt', 'ggml/src/ggml-cuda/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            sccache-cuda129-win2022-${{ env.CUDA_ARCHITECTURES }}-${{ hashFiles('CMakeLists.txt', 'ggml/src/ggml-cuda/CMakeLists.txt') }}-
            sccache-cuda129-win2022-${{ env.CUDA_ARCHITECTURES }}-

      - name: Install minimal CUDA 12.9 toolkit (NVIDIA redist)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          # Keep CUDA on 12.9 (sm_70 Volta support was removed in CUDA 13.x).
          $cudaRoot = "C:\cuda-12.9"
          New-Item -ItemType Directory -Force -Path $cudaRoot | Out-Null

          $redistBase = "https://developer.download.nvidia.com/compute/cuda/redist"
          $manifest = $null
          foreach ($ver in @("12.9.1", "12.9.0")) {
            try {
              $manifest = Invoke-RestMethod -Uri "$redistBase/redistrib_$ver.json" -TimeoutSec 60
              Write-Host "Using NVIDIA CUDA redist manifest $ver"
              break
            } catch {
              Write-Host "Manifest $ver unavailable, trying next..."
            }
          }
          if (-not $manifest) {
            throw "Failed to fetch NVIDIA CUDA 12.9 redist manifest"
          }

          $required = @("cuda_nvcc", "cuda_cudart", "libcublas", "cuda_cccl")
          $optional = @("cuda_crt", "cuda_nvtx", "cuda_profiler_api", "libnvvm")

          foreach ($pkg in ($required + $optional)) {
            $entry = $manifest.$pkg
            if (-not $entry -or -not $entry.'windows-x86_64') {
              if ($required -contains $pkg) {
                throw "Required CUDA package '$pkg' missing from redist manifest"
              }
              continue
            }
            $relPath = $entry.'windows-x86_64'.relative_path
            $url = "$redistBase/$relPath"
            $zipFile = Join-Path $env:RUNNER_TEMP "$pkg.zip"
            Write-Host "Downloading $pkg from $url"
            & curl.exe -fsSL --retry 3 --retry-delay 5 -o $zipFile $url
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $pkg" }
            & tar.exe -xf $zipFile -C $cudaRoot --strip-components=1
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract $pkg" }
            Remove-Item -Force $zipFile
          }

          "$cudaRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$cudaRoot\bin\nvcc.exe" --version

      - name: Configure & build Windows CUDA release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cudaRoot = $env:CUDA_PATH
          & sccache --zero-stats
          & cmake -S . -B build-win-cuda-v100 -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_KVARN=ON `
            -DGGML_CUDA_FA_ALL_QUANTS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES="$($env:CUDA_ARCHITECTURES)" `
            -DCUDAToolkit_ROOT="$cudaRoot" `
            -DCMAKE_CUDA_COMPILER="$cudaRoot\bin\nvcc.exe" `
            -DGGML_CCACHE=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_BACKEND_DL=OFF `
            -DGGML_RPC=OFF `
            -DLLAMA_BUILD_BORINGSSL=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_TOOLS=ON `
            -DLLAMA_BUILD_TESTS=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & cmake --build build-win-cuda-v100 --parallel 3 `
            --target llama-server llama-cli llama-bench llama-perplexity test-backend-ops
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & sccache --show-stats
          & sccache --stop-server | Out-Null

      - name: Package Windows CUDA .zip and separate cudart .zip
        shell: pwsh
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "dist-win-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 1) Main qwen-cpp Windows binaries + project DLLs (compact & fast)
          $appStage = "dist-win-app"
          New-Item -ItemType Directory -Force -Path $appStage | Out-Null
          $binDir = "build-win-cuda-v100\bin"
          foreach ($exe in @("llama-server.exe", "llama-cli.exe", "llama-bench.exe", "llama-perplexity.exe", "test-backend-ops.exe")) {
            $src = Join-Path $binDir $exe
            if (-not (Test-Path $src)) { throw "Expected binary missing: $src" }
            Copy-Item $src $appStage
          }
          Get-ChildItem -Path $binDir -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $appStage
          }
          Copy-Item LICENSE, README.md $appStage

          $appZip = Join-Path $outDir "qwen-cpp-$($env:TAG)-bin-win-cuda-12.9-sm70_86-x64.zip"
          & tar.exe -a -c -f $appZip -C $appStage .
          if ($LASTEXITCODE -ne 0) { throw "Failed to create $appZip" }

          # 2) Separate CUDA 12.9 runtime DLL bundle (for hosts without CUDA 12.9 installed)
          $cudartStage = "dist-win-cudart"
          New-Item -ItemType Directory -Force -Path $cudartStage | Out-Null
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($dll in @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll")) {
            $src = Join-Path $cudaBin $dll
            if (-not (Test-Path $src)) { throw "Expected CUDA runtime DLL missing: $src" }
            Copy-Item $src $cudartStage
          }

          $cudartZip = Join-Path $outDir "cudart-qwen-cpp-bin-win-cuda-12.9-x64.zip"
          & tar.exe -a -c -f $cudartZip -C $cudartStage .
          if ($LASTEXITCODE -ne 0) { throw "Failed to create $cudartZip" }

          Get-ChildItem $outDir | Format-Table Name, Length -AutoSize

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-cuda
          path: dist-win-out/*.zip
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve-tag
      - build-linux-cuda-release
      - build-windows-cuda-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout tag metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download Linux release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-cuda
          path: release-assets

      - name: Download Windows release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-cuda
          path: release-assets

      - name: Generate SHA256SUMS.txt
        run: |
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          DRAFT: ${{ needs.resolve-tag.outputs.draft }}
        run: |
          TAG_NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d')
          HEADER="## qwen-cpp ${TAG} (CUDA 12.9 — Volta \`sm_70\` + Ampere \`sm_86\`)"
          ASSETS_NOTES=$(cat <<EOF
          ### Assets
          - \`qwen-cpp-${TAG}-bin-win-cuda-12.9-sm70_86-x64.zip\` — Windows x64 binaries (\`llama-server\`, \`llama-cli\`, \`llama-bench\`, \`llama-perplexity\`, \`test-backend-ops\`) + project DLLs.
          - \`cudart-qwen-cpp-bin-win-cuda-12.9-x64.zip\` — Optional Windows CUDA 12.9 runtime DLLs (\`cudart64_12.dll\`, \`cublas64_12.dll\`, \`cublasLt64_12.dll\`). Extract alongside the binaries if CUDA 12.9 is not installed on \`PATH\`.
          - \`qwen-cpp-${TAG}-bin-ubuntu-cuda-12.9-sm70_86-x64.zip\` — Ubuntu 24.04 x64 binaries + shared libraries (requires CUDA 12.9 runtime libraries on the host).
          - \`SHA256SUMS.txt\` — SHA-256 checksums for all archives.
          EOF
          )
          if [ -n "$TAG_NOTES" ]; then
            NOTES="${HEADER}"$'\n\n'"${TAG_NOTES}"$'\n\n'"${ASSETS_NOTES}"
          else
            NOTES="${HEADER}"$'\n\n'"${ASSETS_NOTES}"
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber
          else
            ARGS=(release create "$TAG" release-assets/* --repo "${{ github.repository }}" --title "qwen-cpp ${TAG}" --notes "$NOTES" --generate-notes)
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              ARGS+=(--target "${{ github.sha }}")
            fi
            if [ "$DRAFT" = "true" ]; then
              ARGS+=(--draft)
            fi
            gh "${ARGS[@]}"
          fi
